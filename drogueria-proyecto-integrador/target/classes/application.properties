# ===== Base de datos MySQL (XAMPP) =====
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/drogueria?createDatabaseIfNotExist=true&serverTimezone=America/Bogota

# ===== Hibernate / JPA =====
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# ===== Qute =====
quarkus.qute.strict-rendering=false

# ===== Swagger / OpenAPI (/q/swagger-ui y /q/openapi) =====
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Droguería
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Control de inventario, productos por agotarse y ventas del mes

# ===== HTTP =====
quarkus.http.port=8080
quarkus.datasource.db-version=5.5.5
quarkus.hibernate-orm.database.version-check.enabled=false